<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title if title else "Schulte 5×5" }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 text-slate-100">
  <div class="absolute inset-0 opacity-40 pointer-events-none"
       style="background-image: radial-gradient(circle at 20% 10%, rgba(99,102,241,0.35), transparent 45%),
                              radial-gradient(circle at 80% 30%, rgba(236,72,153,0.25), transparent 40%),
                              radial-gradient(circle at 50% 90%, rgba(34,197,94,0.18), transparent 45%);">
  </div>

  <div class="relative container mx-auto px-4 sm:px-6 lg:px-10 2xl:px-14 py-6 sm:py-8 lg:py-10">

    <header class="flex items-center justify-between mb-8">
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 rounded-2xl bg-white/10 ring-1 ring-white/20 backdrop-blur-lg grid place-items-center shadow-xl">
          <span class="text-lg font-bold">S</span>
        </div>
        <div>
          <div class="text-xl font-semibold tracking-tight">舒尔特方格 5×5</div>
          <div class="text-sm text-slate-300">注册登录 · 记录成绩 · 最好/平均 · 建议</div>
        </div>
      </div>

      <nav class="flex items-center gap-3">
        {% if user %}
          <a href="/dashboard" class="px-3 py-2 rounded-xl bg-white/10 ring-1 ring-white/15 backdrop-blur-lg hover:bg-white/15 transition">Dashboard</a>
          <a href="/play" class="px-3 py-2 rounded-xl bg-white/10 ring-1 ring-white/15 backdrop-blur-lg hover:bg-white/15 transition">开始训练</a>
          <form method="post" action="/logout">
            <button class="px-3 py-2 rounded-xl bg-white/10 ring-1 ring-white/15 backdrop-blur-lg hover:bg-white/15 transition">退出</button>
          </form>
        {% else %}
          <a href="/login" class="px-3 py-2 rounded-xl bg-white/10 ring-1 ring-white/15 backdrop-blur-lg hover:bg-white/15 transition">登录</a>
          <a href="/register" class="px-3 py-2 rounded-xl bg-indigo-500/30 ring-1 ring-indigo-300/30 backdrop-blur-lg hover:bg-indigo-500/40 transition">注册</a>
        {% endif %}
      </nav>
    </header>

    {% block content %}{% endblock %}

    <footer class="mt-10 text-xs text-slate-400">
      玻璃拟态风格。<!-- 相关机制参考 Tailwind 文档/示例 -->
    </footer>
  </div>
</body>
</html>
