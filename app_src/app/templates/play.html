{% extends "base.html" %}
{% block content %}
<div class="rounded-3xl bg-white/10 ring-1 ring-white/20 backdrop-blur-xl shadow-2xl p-6 lg:p-8">
  <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
    <div>
      <h1 class="text-2xl font-semibold">开始训练</h1>
      <p class="text-sm text-slate-300 mt-1">按顺序点击 1 → 25。首次点对开始计时。</p>
    </div>
    <div class="flex gap-3">
      <button id="btnNew" class="px-4 py-2 rounded-2xl bg-white/10 ring-1 ring-white/15 hover:bg-white/15 transition">新一局</button>
      <a href="/dashboard" class="px-4 py-2 rounded-2xl bg-indigo-500/25 ring-1 ring-indigo-300/25 hover:bg-indigo-500/35 transition">回到 Dashboard</a>
    </div>
  </div>

  <div class="mt-5 grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2">
      <div class="rounded-3xl bg-white/10 ring-1 ring-white/15 p-4">
        <div class="grid grid-cols-5 gap-3 sm:gap-4 lg:gap-5" id="grid"></div>

      </div>
    </div>

    <div class="rounded-3xl bg-white/10 ring-1 ring-white/15 p-4">
      <div class="text-sm text-slate-300">目标</div>
      <div class="text-3xl font-bold mt-1" id="target">1</div>

      <div class="mt-4 text-sm text-slate-300">用时</div>
      <div class="text-3xl font-bold mt-1"><span id="time">0.00</span><span class="text-base font-medium text-slate-300"> s</span></div>

      <div class="mt-4 text-sm text-slate-300">错误</div>
      <div class="text-3xl font-bold mt-1" id="errors">0</div>

      <div class="mt-5 rounded-2xl bg-indigo-500/15 ring-1 ring-indigo-300/20 p-4 text-sm text-slate-200">
        小技巧：尽量“盯中心，用余光”，减少来回扫视。
      </div>
    </div>
  </div>
</div>

<!-- Result Modal -->
<div id="modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm">
  <div class="max-w-lg mx-auto mt-24 px-4">
    <div class="rounded-3xl bg-white/10 ring-1 ring-white/20 backdrop-blur-xl shadow-2xl p-6 lg:p-8">
      <div class="text-xl sm:text-2xl lg:text-3xl font-semibold">本局结果</div>
      <div class="mt-3 text-sm text-slate-200 space-y-1" id="resultText"></div>
      <div class="mt-4 rounded-2xl bg-white/10 ring-1 ring-white/15 p-4">
        <div class="font-semibold" id="lvl"></div>
        <div class="text-sm text-slate-200 mt-1" id="adv"></div>
        <ul class="text-sm text-slate-300 mt-3 list-disc pl-5" id="tips"></ul>
      </div>
      <div class="mt-5 flex gap-3">
        <button id="btnAgain" class="flex-1 px-4 py-3 rounded-2xl bg-emerald-500/25 ring-1 ring-emerald-300/30 hover:bg-emerald-500/35 transition font-semibold">再来一局</button>
        <button id="btnClose" class="px-4 py-3 rounded-2xl bg-white/10 ring-1 ring-white/15 hover:bg-white/15 transition">关闭</button>
      </div>
    </div>
  </div>
</div>

<script>
  const gridEl = document.getElementById("grid");
  const targetEl = document.getElementById("target");
  const timeEl = document.getElementById("time");
  const errorsEl = document.getElementById("errors");
  const btnNew = document.getElementById("btnNew");

  const modal = document.getElementById("modal");
  const resultText = document.getElementById("resultText");
  const lvl = document.getElementById("lvl");
  const adv = document.getElementById("adv");
  const tipsUl = document.getElementById("tips");
  const btnAgain = document.getElementById("btnAgain");
  const btnClose = document.getElementById("btnClose");

  let target = 1;
  let start = null;
  let timer = null;
  let errors = 0;
  let done = false;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function fmt(n) { return (Math.round(n * 100) / 100).toFixed(2); }

  function reset() {
    target = 1; errors = 0; done = false;
    start = null;
    targetEl.textContent = target;
    errorsEl.textContent = errors;
    timeEl.textContent = "0.00";
    if (timer) { clearInterval(timer); timer = null; }

    const nums = shuffle([...Array(25)].map((_, i) => i + 1));
    gridEl.innerHTML = "";
    nums.forEach(n => {
      const btn = document.createElement("button");
      btn.textContent = n;
      btn.className =
        "aspect-square rounded-2xl bg-white/10 ring-1 ring-white/15 backdrop-blur-lg shadow-lg " +
        "text-xl font-bold hover:bg-white/15 transition active:scale-[0.98]";
      btn.onclick = () => onClick(n, btn);
      gridEl.appendChild(btn);
    });
  }

  function tick() {
    if (!start || done) return;
    const now = performance.now();
    timeEl.textContent = fmt((now - start) / 1000.0);
  }

  async function onFinish(elapsed) {
    // 提交到后端保存
    const res = await fetch("/api/runs", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({grid_size: 5, elapsed_seconds: elapsed, errors}),
    });
    const data = await res.json();

    resultText.innerHTML = `
      <div>用时：<b>${fmt(data.elapsed_seconds)}</b> s</div>
      <div>错误：<b>${data.errors}</b></div>
      <div>惩罚后成绩：<b>${fmt(data.adjusted_seconds)}</b> s</div>
      <div class="mt-2 text-slate-300">当前最好：<b>${data.best_adjusted ? fmt(data.best_adjusted) : "-"}</b> s · 平均：<b>${data.avg_adjusted ? fmt(data.avg_adjusted) : "-"}</b> s</div>
    `;
    lvl.textContent = `等级：${data.level}`;
    adv.textContent = data.advice;

    tipsUl.innerHTML = "";
    (data.tips || []).forEach(t => {
      const li = document.createElement("li");
      li.textContent = t;
      tipsUl.appendChild(li);
    });

    modal.classList.remove("hidden");
  }

  function onClick(n, btn) {
    if (done) return;

    if (start === null) {
      start = performance.now();
      timer = setInterval(tick, 50);
    }

    if (n === target) {
      btn.disabled = true;
      btn.className =
        "aspect-square rounded-2xl bg-emerald-500/20 ring-1 ring-emerald-300/25 " +
        "text-xl font-bold shadow-lg";
      target++;
      targetEl.textContent = target <= 25 ? target : 25;

      if (target === 26) {
        done = true;
        if (timer) clearInterval(timer);
        const elapsed = (performance.now() - start) / 1000.0;
        onFinish(elapsed);
      }
    } else {
      errors++;
      errorsEl.textContent = errors;
      // 小震动反馈（浏览器可能不支持）
      btn.animate([{transform: "translateX(-2px)"}, {transform: "translateX(2px)"}, {transform: "translateX(0)"}], {duration: 120});
    }
  }

  btnNew.onclick = reset;
  btnAgain.onclick = () => { modal.classList.add("hidden"); reset(); };
  btnClose.onclick = () => { modal.classList.add("hidden"); };

  reset();
</script>
{% endblock %}
